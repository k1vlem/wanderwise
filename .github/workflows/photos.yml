name: Fetch photos

# Downloads the photos from photos.manifest.json and commits them to public/photos.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - photos.manifest.json
      - scripts/fetch-photos.mjs

permissions:
  contents: write

concurrency:
  group: photos
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-photos.mjs
      - name: Commit new photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/photos
          if git diff --cached --quiet; then
            echo "No photo changes"
            exit 0
          fi
          git commit -m "Update photos"
          git pull --rebase origin main
          git push origin HEAD:main
